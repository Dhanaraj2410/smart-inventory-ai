{% extends "base.html" %}
{% block page_title %}My Profile{% endblock %}
{% block content %}
<div class="glass-card" style="max-width:520px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">{{ field.label_tag }} {{ field }}</div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
