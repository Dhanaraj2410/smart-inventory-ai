{% extends "base.html" %}
{% block page_title %}AI Insight — {{ product.name }}{% endblock %}
{% block content %}
<div class="glass-card" style="max-width:640px;">
  <h6>{{ product.name }} ({{ product.sku }})</h6>
  <span class="status-badge risk-{{ risk.risk_level }}">{{ risk.risk_level }}</span>
  <p class="mt-3">{{ insight }}</p>
  <a href="{% url 'products:detail' product.pk %}" class="btn btn-sm btn-outline-secondary">Back to product</a>
</div>
{% endblock %}
